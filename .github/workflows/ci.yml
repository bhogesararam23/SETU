name: CI

on:
  # `milestone-*/**` is here because a branch that is never pushed is a branch
  # that is never tested: milestone work landed on a branch, the push matched
  # nothing, and the only run it could have had was after it was already on
  # main. Pull requests still get their own run.
  push:
    branches: [main, vibe/**, "milestone-*/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
          SETU_CACHE_DIR: data/fixtures/upstream
          SETU_OFFLINE: "1"
        run: python -m pytest -v --tb=short

  regression-gates:
    name: Regression gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression gates
        env:
          PYTHONPATH: src
          SETU_CACHE_DIR: data/fixtures/upstream
          SETU_OFFLINE: 1
        run: |
          # Run the full pipeline and verify key metrics
          python -m setu check --days 92 --threshold 15

  offline-replay:
    name: Offline replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Replay from snapshot and compare
        env:
          PYTHONPATH: src
          SETU_CACHE_DIR: data/fixtures/upstream
          SETU_OFFLINE: 1
        run: |
          # A run that merely finishes proves nothing did crash. `verify`
          # compares the fresh payload against results/validation.json and
          # fails on a moved count, a moved digest, or a metric outside its
          # stated tolerance. The action level is read from the payload.
          python -m setu verify --days 92
